name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Browser E2E tests
        run: npm run test:e2e
      - name: Build deployable folder (IIS / any static web server)
        run: npm run build
      - name: Upload deployable package
        uses: actions/upload-artifact@v4
        with:
          name: popshot-web
          path: dist/
